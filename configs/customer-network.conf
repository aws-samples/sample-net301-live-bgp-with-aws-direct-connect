## Customer Network -- Stands in for the customer's on-premises network
## Mirror of DXGW: observation only, no route manipulation.
## Originates 10.0.0.0/8 in every VRF and advertises it to both customer edges, one session per VRF:
##   PREPEND, COMMUNITY : eBGP (VRF AS 65002)   GSHUT : iBGP (AS 65001)

system {
    host-name customer-network;
}

routing-options {
    autonomous-system 65001;
    router-id 10.255.1.3;
}

interfaces {
    eth1 {
        flexible-vlan-tagging;
        unit 100 {
            vlan-id 100;
            family inet {
                address 10.21.1.2/30;   /* PREPEND -> Customer Edge 1 */
            }
        }
        unit 200 {
            vlan-id 200;
            family inet {
                address 10.21.2.2/30;   /* GSHUT -> Customer Edge 1 */
            }
        }
        unit 300 {
            vlan-id 300;
            family inet {
                address 10.21.3.2/30;   /* COMMUNITY -> Customer Edge 1 */
            }
        }
    }
    eth2 {
        flexible-vlan-tagging;
        unit 100 {
            vlan-id 100;
            family inet {
                address 10.22.1.2/30;   /* PREPEND -> Customer Edge 2 */
            }
        }
        unit 200 {
            vlan-id 200;
            family inet {
                address 10.22.2.2/30;   /* GSHUT -> Customer Edge 2 */
            }
        }
        unit 300 {
            vlan-id 300;
            family inet {
                address 10.22.3.2/30;   /* COMMUNITY -> Customer Edge 2 */
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.1.3/32;
            }
        }
    }
}

routing-instances {
    PREPEND {
        instance-type vrf;
        interface eth1.100;
        interface eth2.100;
        route-distinguisher 65001:100;
        vrf-target target:65001:100;
        routing-options {
            autonomous-system 65002 independent-domain;   /* eBGP to the edges in this VRF */
            static {
                route 10.0.0.0/8 discard;
            }
        }
        protocols {
            bgp {
                group customer-edges {
                    type external;
                    peer-as 65001;
                    export ONPREM-ORIGINATE;
                    graceful-shutdown {   /* observation only: do not react to 65535:0 here */
                        receiver {
                            disable;
                        }
                    }
                    neighbor 10.21.1.1;   /* Customer Edge 1 */
                    neighbor 10.22.1.1;   /* Customer Edge 2 */
                }
            }
        }
    }
    GSHUT {
        instance-type vrf;
        interface eth1.200;
        interface eth2.200;
        route-distinguisher 65001:200;
        vrf-target target:65001:200;
        routing-options {
            static {
                route 10.0.0.0/8 discard;
            }
        }
        protocols {
            bgp {
                group customer-edges {
                    type internal;
                    export ONPREM-ORIGINATE;
                    graceful-shutdown {   /* observation only: do not react to 65535:0 here */
                        receiver {
                            disable;
                        }
                    }
                    neighbor 10.21.2.1;   /* Customer Edge 1 */
                    neighbor 10.22.2.1;   /* Customer Edge 2 */
                }
            }
        }
    }
    COMMUNITY {
        instance-type vrf;
        interface eth1.300;
        interface eth2.300;
        route-distinguisher 65001:300;
        vrf-target target:65001:300;
        routing-options {
            autonomous-system 65002 independent-domain;   /* eBGP to the edges in this VRF */
            static {
                route 10.0.0.0/8 discard;
            }
        }
        protocols {
            bgp {
                group customer-edges {
                    type external;
                    peer-as 65001;
                    export ONPREM-ORIGINATE;
                    graceful-shutdown {   /* observation only: do not react to 65535:0 here */
                        receiver {
                            disable;
                        }
                    }
                    neighbor 10.21.3.1;   /* Customer Edge 1 */
                    neighbor 10.22.3.1;   /* Customer Edge 2 */
                }
            }
        }
    }
}

policy-options {
    /* Advertise only the on-prem aggregate; never pass one edge's VPC routes to the other */
    policy-statement ONPREM-ORIGINATE {
        term on-prem {
            from {
                protocol static;
                route-filter 10.0.0.0/8 exact;
            }
            then accept;
        }
        term rest {
            then reject;
        }
    }
}
