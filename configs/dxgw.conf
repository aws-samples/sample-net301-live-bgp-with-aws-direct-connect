## DXGW -- Stands in for the AWS network behind the connections (VGW/DXGW/TGW)
## Originates the VPC prefixes and distributes them to AWS Router 1 and AWS Router 2 via iBGP inet-vpn.
##
## VPC prefixes:
##   Scenario 01  PREPEND    10.101.0.0/24
##   Scenario 02  COMMUNITY  10.103.0.0/24
##   Scenario 03  GSHUT      10.102.0.0/24

system {
    host-name dxgw;
}

routing-options {
    autonomous-system 7224;
    router-id 10.255.0.13;
    /* Resolve VPN next hops via inet.0 so the customer's routes learned from the
       AWS Routers are usable (not Hidden/PnhUnresolv) on DXGW */
    resolution {
        rib bgp.l3vpn.0 {
            resolution-ribs inet.0;
        }
    }
}

interfaces {
    eth1 {
        unit 0 {
            family inet {
                address 10.10.1.2/30;  /* -> AWS Router 1 */
            }
        }
    }
    eth2 {
        unit 0 {
            family inet {
                address 10.10.2.2/30;  /* -> AWS Router 2 */
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.13/32;
            }
        }
    }
}

protocols {
    bgp {
        group aws-routers {
            type internal;
            neighbor 10.10.1.1;  /* AWS Router 1 */
            neighbor 10.10.2.1;  /* AWS Router 2 */
            family inet-vpn {
                unicast;
            }
        }
    }
}

routing-instances {
    PREPEND {
        instance-type vrf;
        route-distinguisher 7224:100;
        vrf-target target:7224:100;
        routing-options {
            static {
                route 10.101.0.0/24 discard;
            }
        }
    }

    GSHUT {
        instance-type vrf;
        route-distinguisher 7224:200;
        vrf-target target:7224:200;
        routing-options {
            static {
                route 10.102.0.0/24 discard;
            }
        }
    }

    COMMUNITY {
        instance-type vrf;
        route-distinguisher 7224:300;
        vrf-target target:7224:300;
        routing-options {
            static {
                route 10.103.0.0/24 discard;
            }
        }
    }
}
