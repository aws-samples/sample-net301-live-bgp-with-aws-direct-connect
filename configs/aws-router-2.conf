## AWS Router 2 -- AWS DX endpoint 2 (Backup Path)
## Mirror of AWS Router 1. Learns VPC routes from DXGW, re-advertises to Customer Edge 2.
## In the PHASES.md walkthrough AWS Router 2 does not change; only AWS Router 1 does.
##
## Interfaces:
##   eth1 -> Customer Edge 2 (customer-edge-2-facing, VLAN trunked, 3 VIFs)
##   eth2 -> DXGW (stands in for the AWS network)

system {
    host-name aws-router-2;
}

routing-options {
    autonomous-system 7224;
    router-id 10.255.0.12;
    static {
        route 10.255.0.13/32 next-hop 10.10.2.2;
    }
    resolution {
        rib bgp.l3vpn.0 {
            resolution-ribs inet.0;
        }
    }
}

interfaces {
    eth1 {
        flexible-vlan-tagging;
        unit 100 {
            vlan-id 100;
            family inet {
                address 10.2.1.2/30;
            }
        }
        unit 200 {
            vlan-id 200;
            family inet {
                address 10.2.2.2/30;
            }
        }
        unit 300 {
            vlan-id 300;
            family inet {
                address 10.2.3.2/30;
            }
        }
    }
    eth2 {
        unit 0 {
            family inet {
                address 10.10.2.1/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.12/32;
            }
        }
    }
}

routing-instances {
    PREPEND {
        instance-type vrf;
        interface eth1.100;
        route-distinguisher 7224:100;
        vrf-target target:7224:100;
        protocols {
            bgp {
                group customer-edge-2 {
                    neighbor 10.2.1.1 {
                        peer-as 65001;
                        export EXPORT-TO-CUSTOMER-NORMAL;
                        import IMPORT-FROM-CUSTOMER-NORMAL;
                    }
                }
            }
        }
    }

    GSHUT {
        instance-type vrf;
        interface eth1.200;
        route-distinguisher 7224:200;
        vrf-target target:7224:200;
        protocols {
            bgp {
                group customer-edge-2 {
                    neighbor 10.2.2.1 {
                        peer-as 65001;
                        export EXPORT-TO-CUSTOMER-NORMAL;
                        import IMPORT-FROM-CUSTOMER-NORMAL;
                    }
                }
            }
        }
    }

    COMMUNITY {
        instance-type vrf;
        interface eth1.300;
        route-distinguisher 7224:300;
        vrf-target target:7224:300;
        protocols {
            bgp {
                group customer-edge-2 {
                    neighbor 10.2.3.1 {
                        peer-as 65001;
                        export EXPORT-TO-CUSTOMER-NORMAL;
                        import IMPORT-FROM-CUSTOMER-NORMAL;
                    }
                }
            }
        }
    }
}

protocols {
    bgp {
        group dxgw {
            type internal;
            neighbor 10.10.2.2 {
                family inet-vpn {
                    unicast;
                }
            }
        }
    }
}

policy-options {
    /* DX local-preference communities the customer attaches (see the AWS Direct Connect routing and BGP documentation) */
    community DX-LOCALPREF-HIGH members 7224:7300;
    community DX-LOCALPREF-MEDIUM members 7224:7200;
    community DX-LOCALPREF-LOW members 7224:7100;
    community GRACEFUL_SHUTDOWN members 65535:0;
    community DX-MAINTENANCE members 7224:2200;

    policy-statement EXPORT-TO-CUSTOMER-NORMAL {
        term vpc-routes {
            from protocol bgp;
            then accept;
        }
    }

    /* Maintenance policies: the same as AWS Router 1. Not used in PHASES.md, kept so both routers match */
    /* MAINTENANCE: every prefix advertised to the customer carries all three signals, in every VRF,
       regardless of how (or whether) the customer reacts:
         1. AS-path prepend (3x)   2. DX maintenance community   3. graceful-shutdown (RFC 8326) */
    policy-statement EXPORT-MAINT-ALL {
        term all-signals {
            from protocol bgp;
            then {
                as-path-prepend "7224 7224 7224";
                community add DX-MAINTENANCE;
                community add GRACEFUL_SHUTDOWN;
                accept;
            }
        }
    }

    policy-statement EXPORT-REJECT-ALL {
        term reject-all {
            then reject;
        }
    }


    /* Inbound preference: the customer's DX community sets local-preference on this router, and the
       value travels inside AWS (iBGP) to DXGW. Higher LP wins. Lab values: only the order matters. */
    policy-statement IMPORT-FROM-CUSTOMER-NORMAL {
        term high {
            from community DX-LOCALPREF-HIGH;
            then {
                local-preference 300;
                accept;
            }
        }
        term medium {
            from community DX-LOCALPREF-MEDIUM;
            then {
                local-preference 200;
                accept;
            }
        }
        term low {
            from community DX-LOCALPREF-LOW;
            then {
                local-preference 100;
                accept;
            }
        }
        term default {
            then accept;
        }
    }
}
