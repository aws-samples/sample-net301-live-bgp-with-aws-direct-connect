## Customer Edge 2 -- Customer Edge Router 2 (Backup DX connection)
## Peers with AWS Router 2 via eBGP (3 VIFs, VLAN-tagged on eth1)
## Peers with Customer Network per VRF (VLAN-tagged on eth2):
##   PREPEND, COMMUNITY : eBGP to Customer Network (AS 65002 in these VRFs), own-AS prepend on export
##   GSHUT              : iBGP to Customer Network (AS 65001), local-preference carries over
## Tags on-prem routes with 7224:7100 (low preference) toward AWS

system {
    host-name customer-edge-2;
}

routing-options {
    autonomous-system 65001;
    router-id 10.255.1.2;
}

interfaces {
    eth1 {
        flexible-vlan-tagging;
        unit 100 {
            vlan-id 100;
            family inet {
                address 10.2.1.1/30;
            }
        }
        unit 200 {
            vlan-id 200;
            family inet {
                address 10.2.2.1/30;
            }
        }
        unit 300 {
            vlan-id 300;
            family inet {
                address 10.2.3.1/30;
            }
        }
    }
    eth2 {
        flexible-vlan-tagging;
        unit 100 {
            vlan-id 100;
            family inet {
                address 10.22.1.1/30;   /* PREPEND -> Customer Network */
            }
        }
        unit 200 {
            vlan-id 200;
            family inet {
                address 10.22.2.1/30;   /* GSHUT -> Customer Network */
            }
        }
        unit 300 {
            vlan-id 300;
            family inet {
                address 10.22.3.1/30;   /* COMMUNITY -> Customer Network */
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.1.2/32;
            }
        }
    }
}

routing-instances {
    PREPEND {
        instance-type vrf;
        interface eth1.100;
        interface eth2.100;
        route-distinguisher 65001:100;
        vrf-target target:65001:100;
        protocols {
            bgp {
                group aws-router-2 {
                    neighbor 10.2.1.2 {
                        peer-as 7224;
                        graceful-shutdown {
                            receiver {
                                disable;
                            }
                        }
                        export CUSTOMER-EXPORT-BACKUP;
                        /* no import policy: routes from AWS accepted as-is */
                    }
                }
                group customer-network {
                    neighbor 10.22.1.2 {
                        peer-as 65002;
                        export ONPREM-PREPEND-3X;
                    }
                }
            }
        }
    }
    GSHUT {
        instance-type vrf;
        interface eth1.200;
        interface eth2.200;
        route-distinguisher 65001:200;
        vrf-target target:65001:200;
        protocols {
            bgp {
                group aws-router-2 {
                    neighbor 10.2.2.2 {
                        peer-as 7224;
                        export CUSTOMER-EXPORT-BACKUP;
                        /* no import policy: routes from AWS accepted as-is */
                    }
                }
                group customer-network {
                    type internal;
                    neighbor 10.22.2.2 {
                        export ONPREM-NEXT-HOP-SELF;
                    }
                }
            }
        }
    }
    COMMUNITY {
        instance-type vrf;
        interface eth1.300;
        interface eth2.300;
        route-distinguisher 65001:300;
        vrf-target target:65001:300;
        protocols {
            bgp {
                group aws-router-2 {
                    neighbor 10.2.3.2 {
                        peer-as 7224;
                        graceful-shutdown {
                            receiver {
                                disable;
                            }
                        }
                        export CUSTOMER-EXPORT-BACKUP;
                        /* no import policy: routes from AWS accepted as-is */
                    }
                }
                group customer-network {
                    neighbor 10.22.3.2 {
                        peer-as 65002;
                        export ONPREM-PREPEND-6X;
                    }
                }
            }
        }
    }
}

policy-options {
    community DX-HIGH-PREF members 7224:7300;
    community DX-MED-PREF members 7224:7200;
    community DX-LOW-PREF members 7224:7100;
    community GRACEFUL_SHUTDOWN members 65535:0;
    community DX-MAINTENANCE members 7224:2200;

    /* Customer failover export to AWS: high preference (promotes this edge to primary) */
    policy-statement CUSTOMER-EXPORT-FAILOVER {
        term on-prem {
            from protocol bgp;
            then {
                community add DX-HIGH-PREF;
                accept;
            }
        }
    }

    /* LP VRFs, export to on-prem over iBGP: next hop = this edge (AWS-side next hops are unknown on-prem) */
    policy-statement ONPREM-NEXT-HOP-SELF {
        term nhs {
            from protocol bgp;
            then {
                next-hop self;
                accept;
            }
        }
    }

    /* Customer Edge 2 export to AWS: low preference (backup in steady state) */
    policy-statement CUSTOMER-EXPORT-BACKUP {
        term on-prem {
            from protocol bgp;
            then {
                community add DX-LOW-PREF;
                accept;
            }
        }
    }

    /* PREPEND VRF, export to on-prem: prepend own AS three times (backup) */
    policy-statement ONPREM-PREPEND-3X {
        term prepend {
            from protocol bgp;
            then {
                as-path-prepend "65001 65001 65001";
                accept;
            }
        }
    }

    /* COMMUNITY VRF, export to on-prem: prepend own AS six times (backup).
       AWS's 3x prepend alone cannot overcome this; Customer Edge 1's DX-MAINT-PREPEND (5x) does. */
    policy-statement ONPREM-PREPEND-6X {
        term prepend {
            from protocol bgp;
            then {
                as-path-prepend "65001 65001 65001 65001 65001 65001";
                accept;
            }
        }
    }

    /* Customer failover, GSHUT: LP 200 on import from AWS, beats Customer Edge 1's LP 150 */
    policy-statement PREFER-BACKUP {
        term prefer {
            then {
                local-preference 200;
                accept;
            }
        }
    }
}
