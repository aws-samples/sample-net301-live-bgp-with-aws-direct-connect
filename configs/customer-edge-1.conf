## Customer Edge 1 -- Customer Edge Router 1 (Primary DX connection)
## Peers with AWS Router 1 via eBGP (3 VIFs, VLAN-tagged on eth1)
## Peers with Customer Network per VRF (VLAN-tagged on eth2):
##   PREPEND, COMMUNITY : eBGP to Customer Network (AS 65002 in these VRFs), own-AS prepend on export
##   GSHUT              : iBGP to Customer Network (AS 65001), local-preference carries over
## Tags on-prem routes with 7224:7200 (medium preference) toward AWS

system {
    host-name customer-edge-1;
}

routing-options {
    autonomous-system 65001;
    router-id 10.255.1.1;
}

interfaces {
    eth1 {
        flexible-vlan-tagging;
        unit 100 {
            vlan-id 100;
            family inet {
                address 10.1.1.1/30;
            }
        }
        unit 200 {
            vlan-id 200;
            family inet {
                address 10.1.2.1/30;
            }
        }
        unit 300 {
            vlan-id 300;
            family inet {
                address 10.1.3.1/30;
            }
        }
    }
    eth2 {
        flexible-vlan-tagging;
        unit 100 {
            vlan-id 100;
            family inet {
                address 10.21.1.1/30;   /* PREPEND -> Customer Network */
            }
        }
        unit 200 {
            vlan-id 200;
            family inet {
                address 10.21.2.1/30;   /* GSHUT -> Customer Network */
            }
        }
        unit 300 {
            vlan-id 300;
            family inet {
                address 10.21.3.1/30;   /* COMMUNITY -> Customer Network */
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.1.1/32;
            }
        }
    }
}

routing-instances {
    PREPEND {
        instance-type vrf;
        interface eth1.100;
        interface eth2.100;
        route-distinguisher 65001:100;
        vrf-target target:65001:100;
        protocols {
            bgp {
                group aws-router-1 {
                    neighbor 10.1.1.2 {
                        peer-as 7224;
                        graceful-shutdown {
                            receiver {
                                disable;
                            }
                        }
                        export CUSTOMER-EXPORT-PRIMARY;
                        /* no import policy: routes from AWS accepted as-is */
                    }
                }
                group customer-network {
                    neighbor 10.21.1.2 {
                        peer-as 65002;
                        export ONPREM-PREPEND-2X;
                    }
                }
            }
        }
    }
    GSHUT {
        instance-type vrf;
        interface eth1.200;
        interface eth2.200;
        route-distinguisher 65001:200;
        vrf-target target:65001:200;
        protocols {
            bgp {
                group aws-router-1 {
                    neighbor 10.1.2.2 {
                        peer-as 7224;
                        export CUSTOMER-EXPORT-PRIMARY;
                        import GSHUT-IMPORT;
                    }
                }
                group customer-network {
                    type internal;
                    neighbor 10.21.2.2 {
                        export ONPREM-NEXT-HOP-SELF;
                    }
                }
            }
        }
    }
    COMMUNITY {
        instance-type vrf;
        interface eth1.300;
        interface eth2.300;
        route-distinguisher 65001:300;
        vrf-target target:65001:300;
        protocols {
            bgp {
                group aws-router-1 {
                    neighbor 10.1.3.2 {
                        peer-as 7224;
                        graceful-shutdown {
                            receiver {
                                disable;
                            }
                        }
                        export CUSTOMER-EXPORT-PRIMARY;
                        import DX-MAINT-PREPEND;
                    }
                }
                group customer-network {
                    neighbor 10.21.3.2 {
                        peer-as 65002;
                        export ONPREM-PREPEND-2X;
                    }
                }
            }
        }
    }
}

policy-options {
    community DX-HIGH-PREF members 7224:7300;
    community DX-MED-PREF members 7224:7200;
    community DX-LOW-PREF members 7224:7100;
    community GRACEFUL_SHUTDOWN members 65535:0;
    community DX-MAINTENANCE members 7224:2200;

    /* Customer failover export to AWS: high preference (promotes this edge to primary) */
    policy-statement CUSTOMER-EXPORT-FAILOVER {
        term on-prem {
            from protocol bgp;
            then {
                community add DX-HIGH-PREF;
                accept;
            }
        }
    }

    /* LP VRFs, export to on-prem over iBGP: next hop = this edge (AWS-side next hops are unknown on-prem) */
    policy-statement ONPREM-NEXT-HOP-SELF {
        term nhs {
            from protocol bgp;
            then {
                next-hop self;
                accept;
            }
        }
    }

    /* Customer Edge 1 export to AWS: medium preference (primary in steady state) */
    policy-statement CUSTOMER-EXPORT-PRIMARY {
        term on-prem {
            from protocol bgp;
            then {
                community add DX-MED-PREF;
                accept;
            }
        }
    }

    /* AS-path VRFs, export to on-prem: prepend own AS twice */
    policy-statement ONPREM-PREPEND-2X {
        term prepend {
            from protocol bgp;
            then {
                as-path-prepend "65001 65001";
                accept;
            }
        }
    }

    /* GSHUT import: LP 150 in steady state, LP 0 when GSHUT community present */
    policy-statement GSHUT-IMPORT {
        term match-gshut {
            from community GRACEFUL_SHUTDOWN;
            then {
                local-preference 0;
                accept;
            }
        }
        term default {
            then {
                local-preference 150;
                accept;
            }
        }
    }

    /* DX maintenance community -> prepend own AS 5x */
    policy-statement DX-MAINT-PREPEND {
        term match-maint {
            from community DX-MAINTENANCE;
            then {
                as-path-prepend "65001 65001 65001 65001 65001";
                accept;
            }
        }
        term default {
            then accept;
        }
    }
}
